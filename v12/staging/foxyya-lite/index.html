<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061018" />
  <title>FOXYYA Lite</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">FOXYYA</div>
        <div class="brand-sub">C / 專業交易</div>
      </div>
      <div class="top-actions">
        <span class="mode-pill"><span class="live-dot"></span>模擬模式</span>
        <div class="avatar" aria-label="FOXYYA">🦊</div>
      </div>
    </header>

    <details class="usage-help">
      <summary>功能與資料說明</summary>
      <p>行情僅包含 BTC、ETH、SOL 的公開資料；LIVE 不代表模擬帳戶或交易引擎已就緒。</p>
      <p>收藏只儲存在目前瀏覽器。國際熱點為示意內容，經濟日曆、回測執行與 NAV 圖表尚未提供。</p>
      <p>資產、持倉與績效須等待唯讀快照及帳本驗證；「—」不代表零值。</p>
      <p>PAPER_ONLY · REAL_ORDER_LOCK · No Backfill</p>
    </details>
    <form class="searchbar" id="search-form" role="search">
      <label for="market-search" id="search-label">搜尋行情幣種</label>
      <div class="search-controls">
        <input id="market-search" type="search" placeholder="BTC、ETH、SOL" maxlength="80" autocomplete="off" />
        <button id="search-clear" type="button">清除</button>
      </div>
    </form>
    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要導覽">
      <a href="#/" data-route="home"><span class="nav-icon">⌂</span><span>首頁</span></a>
      <a href="#/strategies" data-route="strategies"><span class="nav-icon">▥</span><span>交易策略</span></a>
      <a href="#/orders" data-route="orders"><span class="nav-icon">▤</span><span>持倉訂單</span></a>
      <a href="#/results" data-route="results"><span class="nav-icon">◷</span><span>交易結果</span></a>
      <a href="#/backtest" data-route="backtest"><span class="nav-icon">⌬</span><span>策略測試</span></a>
    </nav>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
