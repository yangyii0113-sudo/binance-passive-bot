name: FOXYYA TW Official Data Live Smoke

on:
  push:
    branches:
      - tw-research-platform-v1-20260919
    paths:
      - '.github/workflows/tw-live-smoke.yml'
      - 'tools/tw_public_data_smoke.py'
      - 'research/tw/providers/**'
      - 'research/tw/acquisition.py'
      - 'research/tw/history.py'
      - 'research/tw/technical_contracts.py'
      - 'research/tw/intelligence/technical*.py'
      - 'research/tw/services/historical_window.py'
      - 'tools/tw_technical_smoke.py'
      - 'tools/tw_fundamentals_smoke.py'
      - 'research/tw/fundamental_contracts.py'
      - 'research/tw/disclosure_archive.py'
      - 'research/tw/intelligence/fundamentals.py'
      - 'research/tw/services/fundamentals.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile live-smoke script
        run: python -m py_compile tools/tw_public_data_smoke.py

      - name: Run official TWSE / TPEx public-data smoke
        env:
          PYTHONPATH: .
        run: python tools/tw_public_data_smoke.py

      - name: Run official TWSE / TPEx technical-research smoke
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: .
        run: python tools/tw_technical_smoke.py

      - name: Run official TWSE / TPEx fundamentals and events smoke
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: .
        run: python tools/tw_fundamentals_smoke.py
