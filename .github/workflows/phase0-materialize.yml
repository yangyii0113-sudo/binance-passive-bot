name: FOXYYA Phase 0 Materialize

on:
  push:
    branches:
      - design/foxyya-backtest-source-normalization
    paths:
      - .github/workflows/phase0-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Materialize exact production source bytes
        run: python -m tools.materialize_runtime_source

      - name: Verify byte parity before commit
        run: python -m pytest tests/test_source_parity.py -v

      - name: Commit normalized source tree to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/foxyya FOXYYA_V2_CONFIG.json intel_feeds.py run_forward_paper.py
          git diff --cached --exit-code && exit 0
          git commit -m "refactor: materialize canonical FOXYYA source tree"
          git push origin HEAD:design/foxyya-backtest-source-normalization
