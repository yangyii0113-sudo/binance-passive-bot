name: FOXYYA Public Shadow Scan

on:
  push:
    branches:
      - foxyya-ledger-reconcile-20260918
    paths:
      - .github/workflows/foxyya-shadow-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: foxyya-ledger-reconcile-20260918
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full public-data shadow scan
        env:
          PYTHONPATH: src
        run: |
          python tools/run_public_shadow_scan.py --output /tmp/foxyya-shadow-scan.json --max-workers 16 | tee /tmp/foxyya-shadow-summary.json

      - name: Persist shadow evidence
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          mkdir -p reports/forward_scan_shadow
          cp /tmp/foxyya-shadow-scan.json "reports/forward_scan_shadow/${stamp}.json"
          cp /tmp/foxyya-shadow-summary.json "reports/forward_scan_shadow/${stamp}.summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "4189827+github-actions[bot]@users.noreply.github.com"
          git add reports/forward_scan_shadow
          git commit -m "data: persist FOXYYA public shadow scan ${stamp}" || exit 0
          git push origin HEAD:foxyya-ledger-reconcile-20260918

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: foxyya-public-shadow-scan
          path: |
            /tmp/foxyya-shadow-scan.json
            /tmp/foxyya-shadow-summary.json
          retention-days: 7

