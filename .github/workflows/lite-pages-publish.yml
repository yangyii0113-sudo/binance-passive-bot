name: FOXYYA Lite Pages Publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lite-pages-publish.yml
      - v12/staging/foxyya-lite/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foxyya-lite-pages
  cancel-in-progress: true

jobs:
  deploy:
    # This cutover only takes effect after review and merge to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v12/staging/foxyya-lite
    environment:
      name: foxyya-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source that will be published
        run: npm test
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: v12/staging/foxyya-lite/dist
      - name: Deploy FOXYYA Lite
        id: deployment
        uses: actions/deploy-pages@v4
