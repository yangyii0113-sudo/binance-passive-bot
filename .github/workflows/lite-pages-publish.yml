name: FOXYYA Lite Pages Publish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lite-pages-publish.yml
  workflow_run:
    workflows:
      - FOXYYA Lite Deploy Check
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foxyya-lite-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'foxyya-lite-railway-deploy')
    runs-on: ubuntu-latest
    environment:
      name: foxyya-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout FOXYYA Lite
        uses: actions/checkout@v4
        with:
          ref: foxyya-lite-railway-deploy
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          BUILD_SHA="$(git rev-parse --short HEAD)"
          mkdir -p _site
          sed "s#./styles.css#./styles.css?v=$BUILD_SHA#g; s#./src/main.js#./src/main.js?v=$BUILD_SHA#g" index.html > _site/index.html
          cp styles.css package.json _site/
          cp -R src _site/src
          printf '{"build":"%s"}\n' "$BUILD_SHA" > _site/build.json
          echo "Publishing FOXYYA Lite build $BUILD_SHA"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy FOXYYA Lite
        id: deployment
        uses: actions/deploy-pages@v4
