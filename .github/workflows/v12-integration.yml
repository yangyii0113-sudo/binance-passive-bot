name: FOXYYA v12 Integration

on:
  push:
    branches:
      - v12-multimarket-architecture
      - v12-research-usability-20260909
      - v12-platform-completion-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v12-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v12 branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runtime versions
        run: |
          node --version
          python --version

      - name: Enforce v12 branch scope
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --name-only origin/main HEAD > /tmp/v12-changed-files.txt
          node - <<'NODE'
          const fs=require('node:fs');
          const {auditChangedPaths}=require('./v12/staging/branch_scope_gate.js');
          const paths=fs.readFileSync('/tmp/v12-changed-files.txt','utf8').split(/\r?\n/).filter(Boolean);
          const audit=auditChangedPaths(paths);
          if(!audit.safe){
            console.error('Forbidden v12 branch paths:',audit.forbidden.join(', '));
            process.exit(1);
          }
          console.log('v12 branch scope OK:',paths.length,'changed files; Production release authorized:',audit.productionReleaseAuthorized);
          NODE

      - name: Run P1.4 source-pipeline provider-health focused tests
        run: node --test tests/v12_source_pipeline_provider_health.test.cjs

      - name: Run v12 Node contract and integration tests
        run: node --test tests/v12_*.test.cjs

      - name: Run existing runtime JavaScript regressions
        run: node --test tests/runtime_bridge.test.cjs tests/runtime_layout.test.cjs tests/runtime_metrics.test.cjs tests/runtime_backtest.test.cjs

      - name: Run existing Python runtime regression
        run: python tests/test_runtime_view.py

      - name: Verify production safety strings remain present
        shell: bash
        run: |
          grep -q 'PAPER_ONLY=true' Dockerfile
          grep -q 'REAL_ORDER_LOCK=true' Dockerfile
          grep -q 'PAPER_ONLY' service.py
          grep -q 'real_orders.*False\|real_orders.*false' runtime_view.py