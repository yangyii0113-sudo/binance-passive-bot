name: FOXYYA Lite Gate A

on:
  push:
    branches:
      - foxyya-lite-v1-20260917
      - v12-platform-completion-20260910
    paths:
      - 'foxyya-lite/**'
      - '.github/workflows/foxyya-lite-gate-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: foxyya-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check modules
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Gate A smoke tests
        run: npm test
