name: FOXYYA Phase 3 Backtest Completion

on:
  push:
    branches:
      - feat/foxyya-backtest-phase3-complete
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Complete Python regression suite
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest
          tests/test_source_parity.py
          tests/test_packaging_runtime_parity.py
          tests/test_normalized_imports.py
          tests/test_runtime_safety.py
          tests/test_runtime_view.py
          tests/test_no_lookahead.py
          tests/test_historical_market.py
          tests/test_research_ledger.py
          tests/test_historical_core_integrity.py
          tests/test_replay_timeline.py
          tests/test_replay_lifecycle.py
          tests/test_future_legal_open_replay.py
          tests/test_replay_reproducibility.py
          tests/test_backtest_metrics.py
          tests/test_backtest_report.py
          tests/test_binance_history.py
          tests/test_eth_one_year_replay.py
          tests/test_backtest_api.py
          tests/test_historical_snapshot_limits.py
          -v
      - name: Complete Node UI/runtime regression suite
        run: >-
          node --test
          tests/runtime_bridge.test.cjs
          tests/runtime_layout.test.cjs
          tests/runtime_metrics.test.cjs
          tests/runtime_backtest.test.cjs
      - name: Build production Docker image with historical subsystem
        run: docker build -t foxyya-backtest-complete .
      - name: Smoke-test Forward safety and Backtest imports inside image
        run: |
          docker run --rm --entrypoint python foxyya-backtest-complete -c "import foxyya,service,backtest.cli,backtest.metrics,backtest.report; assert foxyya.REAL_ORDER_LOCK is True; s=service.RuntimeState('phase3-smoke').snapshot(); assert s['paper_only'] is True and s['real_order_lock'] is True; print(foxyya.VERSION)"
