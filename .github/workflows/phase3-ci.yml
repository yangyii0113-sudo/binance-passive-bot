name: FOXYYA Phase 3 Backtest Completion

on:
  push:
    branches:
      - feat/foxyya-backtest-phase3-complete
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Backtest completion contracts
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest
          tests/test_backtest_metrics.py
          tests/test_backtest_report.py
          tests/test_binance_history.py
          tests/test_eth_one_year_replay.py
          -v
