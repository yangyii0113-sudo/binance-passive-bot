name: FOXYYA Phase 0 Parity

on:
  push:
    branches:
      - design/foxyya-backtest-source-normalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Print production archive inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.verify_runtime_archive import archive_manifest, assemble_runtime_archive
          for path, digest in sorted(archive_manifest(assemble_runtime_archive(Path('backend_parts2'))).items()):
              print(f'{digest}  {path}')
          PY

      - name: Archive and canonical byte parity
        run: python -m pytest tests/test_source_parity.py -v

      - name: Normalized source imports
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_normalized_imports.py -v

      - name: Paper-only safety invariants
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_runtime_safety.py -v

      - name: Existing Python regressions
        run: python -m pytest tests/test_runtime_view.py -v

      - name: Existing Node regressions
        run: node --test tests/runtime_bridge.test.cjs tests/runtime_layout.test.cjs tests/runtime_metrics.test.cjs

      - name: Build normalized Docker image
        run: docker build -t foxyya-source-normalized .

      - name: Smoke-test image imports and safety lock
        run: |
          docker run --rm --entrypoint python foxyya-source-normalized -c "import foxyya,service; assert foxyya.REAL_ORDER_LOCK is True; s=service.RuntimeState('image-smoke').snapshot(); assert s['paper_only'] is True and s['real_order_lock'] is True; print(foxyya.VERSION)"
