name: FOXYYA Feature CI

on:
  push:
    branches:
      - feat/foxyya-backtest-source-normalization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Python regression suite
        run: python -m pytest tests -v
      - name: Run JavaScript regression suite
        run: node --test tests/*.test.cjs
      - name: Build canonical-source Docker image
        run: docker build -t foxyya-source-parity .
      - name: Verify safety lock strings in built image
        run: |
          docker inspect foxyya-source-parity --format '{{json .Config.Env}}' > /tmp/foxyya-image-env.json
          grep -q 'PAPER_ONLY=true' /tmp/foxyya-image-env.json
          grep -q 'REAL_ORDER_LOCK=true' /tmp/foxyya-image-env.json
          grep -q 'FOXYYA_DB=/data/foxyya_v2_paper.sqlite' /tmp/foxyya-image-env.json
