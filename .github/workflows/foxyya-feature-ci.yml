name: FOXYYA Feature CI

on:
  push:
    branches:
      - feat/foxyya-backtest-source-normalization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run source parity contract
        run: python -m pytest tests/test_source_parity.py -v
