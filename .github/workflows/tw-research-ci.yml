name: FOXYYA TW Research Architecture Gate

on:
  push:
    branches:
      - tw-research-platform-v1-20260919
    paths:
      - 'research/tw/**'
      - 'tw_platform/**'
      - 'tests/test_tw_*.py'
      - 'tests/fixtures/tw/**'
      - 'docs/tw/**'
      - '.github/workflows/tw-research-ci.yml'
      - 'tools/tw_technical_smoke.py'
  pull_request:
    paths:
      - 'research/tw/**'
      - 'tw_platform/**'
      - 'tests/test_tw_*.py'
      - 'tests/fixtures/tw/**'
      - 'docs/tw/**'
      - '.github/workflows/tw-research-ci.yml'
      - 'tools/tw_technical_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Taiwan research modules
        run: python -m compileall -q research/tw

      - name: Run all Taiwan architecture and active-phase gates
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_tw_*.py -v
