name: FOXYYA Lite Main CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'v12/staging/foxyya-lite/**'
      - '.github/workflows/lite-main-ci.yml'
      - '.github/workflows/lite-pages-publish.yml'
      - 'netlify.toml'
  push:
    branches: [foxyya-lite-main-isolation-20260927]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v12/staging/foxyya-lite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated change scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], os.environ['HEAD_SHA']], text=True).splitlines()
          allowed = {'.github/workflows/lite-main-ci.yml', '.github/workflows/lite-pages-publish.yml', 'netlify.toml'}
          unexpected = [p for p in paths if not (p.startswith('v12/staging/foxyya-lite/') or p in allowed)]
          if unexpected:
              raise SystemExit('Changes outside Lite boundary: ' + ', '.join(unexpected))
          print('LITE_SCOPE_OK: Production Execution V2 files unchanged')
          PY
      - name: Verify syntax and full Lite suite
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
      - name: Build reviewed source
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: foxyya-lite-main-static
          path: v12/staging/foxyya-lite/dist
          if-no-files-found: error
          retention-days: 7
