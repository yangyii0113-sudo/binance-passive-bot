name: FOXYYA Phase 2 Replay Engine

on:
  push:
    branches:
      - main
      - feat/foxyya-backtest-phase2-replay-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Phase 2 replay plus Phase 1 and Phase 0 Python regressions
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest \
            tests/test_replay_timeline.py \
            tests/test_replay_lifecycle.py \
            tests/test_future_legal_open_replay.py \
            tests/test_replay_reproducibility.py \
            tests/test_no_lookahead.py \
            tests/test_historical_market.py \
            tests/test_research_ledger.py \
            tests/test_historical_core_integrity.py \
            tests/test_source_parity.py \
            tests/test_packaging_runtime_parity.py \
            tests/test_normalized_imports.py \
            tests/test_runtime_safety.py \
            tests/test_runtime_view.py -v

      - name: Existing Node regressions
        run: node --test tests/runtime_bridge.test.cjs tests/runtime_layout.test.cjs tests/runtime_metrics.test.cjs

      - name: Build production Docker image from normalized source
        run: docker build -t foxyya-phase2-check .

      - name: Smoke-test production core safety lock
        run: |
          docker run --rm --entrypoint python foxyya-phase2-check -c "import foxyya,service; assert foxyya.REAL_ORDER_LOCK is True; s=service.RuntimeState('phase2-smoke').snapshot(); assert s['paper_only'] is True and s['real_order_lock'] is True; print(foxyya.VERSION)"
