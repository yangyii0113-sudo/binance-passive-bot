name: FOXYYA Phase 2 Replay Engine

on:
  push:
    branches:
      - feat/foxyya-backtest-phase2-replay-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Replay timeline lifecycle and future legal open contracts
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest
          tests/test_replay_timeline.py
          tests/test_replay_lifecycle.py
          tests/test_future_legal_open_replay.py
          -v
