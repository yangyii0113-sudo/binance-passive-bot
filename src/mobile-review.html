<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOXYYA 手機與平板尺寸驗收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101112;color:#eee;font:15px system-ui}
header{padding:16px clamp(12px,3vw,32px);border-bottom:1px solid #333;background:#17191b}
.toolbar{max-width:1200px;margin:auto}h1{font-size:20px;margin:0 0 12px}
.controls,nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls{margin-bottom:10px}label{display:flex;align-items:center;gap:8px}
button,select,a{font:inherit}button,select,.open{min-height:44px;padding:10px 14px;border:1px solid #51565b;border-radius:10px;background:#22262a;color:#eee}
button{cursor:pointer}button[aria-pressed="true"]{background:#efbc50;color:#19160e;border-color:#efbc50}
:focus-visible{outline:3px solid #f6d884;outline-offset:3px}.open{margin-left:auto;text-decoration:none}
details{margin-top:10px;color:#b5bbc0;font-size:13px}summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
details p{max-width:900px;line-height:1.6;margin:6px 0}main{padding:14px 12px 20px;overflow:auto}
.status{text-align:center;color:#b5bbc0;font-size:13px;margin:0 0 10px}
.viewport{width:100%;overflow:auto;padding:2px}.frame-shell{position:relative;margin-inline:auto;flex:none}
iframe{display:block;border:0;background:#111;transform-origin:top left;box-shadow:0 0 0 1px #80662e;border-radius:12px}
@media(max-width:600px){h1{font-size:18px}.controls{gap:6px}label{width:100%}select{flex:1;min-width:0}.open{margin-left:0}nav button{flex:1 0 28%;padding:8px}header{padding:12px}}
</style>
</head>
<body>
<header><div class="toolbar">
<h1>手機與平板尺寸驗收</h1>
<div class="controls">
<label>裝置<select id="device"><option value="portrait">13 吋 iPad・直式</option><option value="landscape">13 吋 iPad・橫式</option><option value="phone360">手機・360 像素</option><option value="phone390">手機・390 像素</option><option value="phone430">手機・430 像素</option></select></label>
<button id="fit" aria-pressed="true">適合視窗</button><button id="actual" aria-pressed="false">原尺寸 100%</button>
<a class="open" id="open-platform" target="_blank" rel="noopener">直接開啟平台 ↗</a>
</div>
<nav aria-label="驗收頁面"><button data-route="/">首頁</button><button data-route="/advice">交易建議</button><button data-route="/advice-results">建議成效</button><button data-route="/strategies">強勢訊號</button><button data-route="/orders">持倉訂單</button><button data-route="/lab">策略實驗室</button></nav>
<details><summary>尺寸與驗收說明</summary><p>預覽會等比例縮放，平台內部仍使用選定的視窗尺寸。「原尺寸」可檢查文字與按鈕大小；「直接開啟平台」適合在你的 iPad 上實際操作。直式 1032 × 1376、橫式 1376 × 1032 像素；Safari 工具列、縮放與分割視窗會改變可用尺寸。此頁不能代替 iPadOS／iPhone Safari 真機的觸控、鍵盤、安全區與下載驗收。</p></details>
</div></header>
<main><p class="status" id="size-status"></p><div class="viewport"><div class="frame-shell"><iframe title="13 吋 iPad 直式平台"></iframe></div></div></main>
<script>
const site=new URL(location.pathname.includes('/releases/')?'../../../':'../',location.href);
const revision=location.pathname.match(/\/releases\/([^/]+)\//)?.[1];
if(revision)site.searchParams.set('review',revision);
const profiles={portrait:{width:1032,height:1376,label:'13 吋 iPad 直式'},landscape:{width:1376,height:1032,label:'13 吋 iPad 橫式'},phone360:{width:360,height:844,label:'360 像素手機'},phone390:{width:390,height:844,label:'390 像素手機'},phone430:{width:430,height:844,label:'430 像素手機'}};
const frame=document.querySelector('iframe'),shell=document.querySelector('.frame-shell'),viewport=document.querySelector('.viewport'),device=document.querySelector('#device');
let fit=true,currentRoute='/';
function syncRoute(){
 try{currentRoute=frame.contentWindow.location.hash.slice(1)||'/';}catch{return;}
 document.querySelector('#open-platform').href=site.href+'#'+currentRoute;
 for(const button of document.querySelectorAll('[data-route]'))button.setAttribute('aria-pressed',String(button.dataset.route===currentRoute));
}
function resizePreview(){
 const item=profiles[device.value];
 const availableHeight=Math.max(240,window.innerHeight-document.querySelector('header').offsetHeight-72);
 const scale=fit?Math.min(1,Math.max(1,viewport.clientWidth-4)/item.width,availableHeight/item.height):1;
 frame.width=item.width;frame.height=item.height;frame.title=item.label+'平台';
 frame.style.transform='scale('+scale+')';
 shell.style.width=item.width*scale+'px';shell.style.height=item.height*scale+'px';
 document.querySelector('#size-status').textContent=item.label+' · '+item.width+' × '+item.height+' · 顯示 '+Math.round(scale*100)+'%';
 document.querySelector('#fit').setAttribute('aria-pressed',String(fit));
 document.querySelector('#actual').setAttribute('aria-pressed',String(!fit));
}
frame.addEventListener('load',()=>{syncRoute();try{frame.contentWindow.addEventListener('hashchange',syncRoute);}catch{}});
device.addEventListener('change',resizePreview);
document.querySelector('#fit').addEventListener('click',()=>{fit=true;resizePreview();});
document.querySelector('#actual').addEventListener('click',()=>{fit=false;resizePreview();});
document.querySelector('nav').addEventListener('click',event=>{const route=event.target.closest('[data-route]')?.dataset.route;if(route){currentRoute=route;frame.src=site.href+'#'+route;}});
window.addEventListener('resize',resizePreview);
new ResizeObserver(resizePreview).observe(document.querySelector('header'));
document.querySelector('#open-platform').href=site.href+'#/';
frame.src=site.href+'#/';
resizePreview();
</script>
</body></html>
