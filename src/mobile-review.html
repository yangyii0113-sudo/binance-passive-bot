<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOXYYA 手機與平板尺寸驗收</title>
<style>body{font:16px system-ui;background:#101112;color:#eee;margin:16px}button{min-height:44px;margin:4px;padding:10px}main{display:flex;gap:20px;align-items:start;overflow:auto}iframe{border:1px solid #a77d2a;background:#111;display:block}section{flex:none}p{max-width:800px;line-height:1.6}</style>
<h1>手機與平板尺寸驗收</h1><p>手機 360／390／430、13 吋 iPad 直式 1032 × 1376、橫式 1376 × 1032 像素的同源頁面。此頁檢查響應式佈局，不能代替 iPhone／iPadOS Safari 真機的觸控、鍵盤、安全區與下載驗收；瀏覽器工具列、縮放與分割視窗會改變可用尺寸。長表格可在表格內左右滑動。</p>
<div role="group" aria-label="裝置尺寸"><button data-profile="phone" aria-pressed="true">手機 360／390／430</button><button data-profile="portrait" aria-pressed="false">13 吋 iPad 直式</button><button data-profile="landscape" aria-pressed="false">13 吋 iPad 橫式</button></div><nav aria-label="驗收頁面"><button data-route="/">首頁</button><button data-route="/advice">交易建議</button><button data-route="/advice-results">建議成效</button><button data-route="/strategies">強勢訊號</button><button data-route="/orders">持倉訂單</button><button data-route="/lab">策略實驗室</button></nav><main></main>
<script>
// Current Pages releases live at releases/<revision>/src/, while local builds serve /src/.
const site=new URL(location.pathname.includes('/releases/')?'../../../':'../',location.href);
// Separate each release's review from a previously cached public entry page.
const revision=location.pathname.match(/\/releases\/([^/]+)\//)?.[1];
if(revision)site.searchParams.set('review',revision);
const profiles={phone:[{width:360,height:844},{width:390,height:844},{width:430,height:844}],portrait:[{width:1032,height:1376,label:'13 吋 iPad 直式'}],landscape:[{width:1376,height:1032,label:'13 吋 iPad 橫式'}]};
let currentRoute='/strategies';
function renderProfile(profile){
 const main=document.querySelector('main');main.replaceChildren();
 for(const item of profiles[profile]){
  const section=document.createElement('section');const heading=document.createElement('h2');
  heading.textContent=item.label?item.label+' · '+item.width+' × '+item.height:item.width+' 像素';
  const frame=document.createElement('iframe');frame.title=item.label?item.label+'平台':item.width+' 像素平台';
  frame.width=item.width;frame.height=item.height;frame.src=site.href+'#'+currentRoute;
  section.append(heading,frame);main.append(section);
 }
 for(const button of document.querySelectorAll('[data-profile]'))button.setAttribute('aria-pressed',String(button.dataset.profile===profile));
}
renderProfile('phone');
document.querySelector('[aria-label="裝置尺寸"]').addEventListener('click',event=>{const profile=event.target.dataset.profile;if(profiles[profile])renderProfile(profile);});
document.querySelector('nav').addEventListener('click',event=>{const route=event.target.dataset.route;if(route){currentRoute=route;for(const frame of document.querySelectorAll('iframe'))frame.src=site.href+'#'+route;}});
</script></html>
