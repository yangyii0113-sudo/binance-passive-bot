<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOXYYA 手機尺寸驗收</title>
<style>body{font:16px system-ui;background:#101112;color:#eee;margin:16px}button{min-height:44px;margin:4px;padding:10px}main{display:flex;gap:20px;align-items:start;overflow:auto}iframe{height:844px;border:1px solid #a77d2a;background:#111;display:block}section{flex:none}p{max-width:800px;line-height:1.6}</style>
<h1>手機尺寸驗收</h1><p>360／390／430 像素的同源頁面。此頁檢查響應式佈局，不能代替 iPhone Safari 真機的觸控、鍵盤、安全區與下載驗收。長表格可在表格內左右滑動。</p>
<nav><button data-route="/">首頁</button><button data-route="/strategies">交易策略</button><button data-route="/orders">持倉訂單</button><button data-route="/lab">策略實驗室</button></nav><main></main>
<script>
// Current Pages releases live at releases/<revision>/src/, while local builds serve /src/.
const site=new URL(location.pathname.includes('/releases/')?'../../../':'../',location.href);
for(const width of [360,390,430]){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=width+' 像素';const frame=document.createElement('iframe');frame.title=width+' 像素平台';frame.width=width;frame.src=site.href+'#/strategies';section.append(heading,frame);document.querySelector('main').append(section);}
document.querySelector('nav').addEventListener('click',event=>{const route=event.target.dataset.route;if(route)for(const frame of document.querySelectorAll('iframe'))frame.src=site.href+'#'+route;});
</script></html>
