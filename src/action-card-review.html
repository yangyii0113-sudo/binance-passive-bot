<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOXYYA 行動卡版面示例</title><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;min-width:0;background:#10191c;font:14px system-ui;color:#e4ece9}*{box-sizing:border-box}.demo-header{padding:16px;position:relative;z-index:2;background:#172328;border-bottom:1px solid #466059}.demo-header h1{font-size:20px;margin:0 0 8px}.demo-header p{margin:8px 0;color:#e9ce8b;line-height:1.6}.demo-controls{display:flex;gap:8px;flex-wrap:wrap}.demo-controls button,.demo-controls select{min-height:44px;padding:8px 12px;background:#23373c;border:1px solid #597971;border-radius:8px;color:#eee;font:inherit}.demo-controls button[aria-pressed=true]{background:#d9bd70;color:#172220}.demo-stage{padding:16px;overflow:auto}.demo-frame{border:1px solid #536a66;border-radius:14px;display:block;transform-origin:top left;background:#10191c}.demo-shell{margin:auto}.demo-content{max-width:1340px;margin:auto;padding:14px}.demo-note{font-size:12px;color:#e8c36f;padding:10px;background:#302d21;margin:0 0 12px;border-radius:8px}.demo-content .home-opportunities>section.advice-monitor,.demo-content .home-opportunities>.research-home-actions{display:none}.demo-content .home-opportunities>details[data-search=home-ranking-rules]{display:none}.demo-status:empty{display:none}.demo-status{min-height:20px;color:#e8c36f;margin:8px 0}
</style></head><body><header class="demo-header"><h1>行動卡版面示例</h1><p>全部數字為排版測試資料，非即時行情、非交易建議。此頁不會產生交易或保存關注設定。</p><div class="demo-controls" id="outer-controls"><label>裝置 <select id="device"><option value="390">手機 390</option><option value="360">手機 360</option><option value="430">手機 430</option><option value="1032">13 吋 iPad 直式</option><option value="1376">13 吋 iPad 橫式</option></select></label><button id="fit" aria-pressed="true">適合視窗</button></div><div class="demo-controls" id="scenarios" hidden><button data-scenario="long">做多計畫</button><button data-scenario="short">做空計畫</button><button data-scenario="wait">等待條件</button><button data-scenario="expired">已過期</button><button data-scenario="unavailable">行情不可用</button><button data-scenario="tiny">小額幣</button><button id="break-logo">圖示載入失敗</button></div></header><main id="content"></main>
<script type="module">
import {homeOpportunityView} from './home_opportunities.js';
const embedded=new URLSearchParams(location.search).has('frame'),content=document.querySelector('#content');
if(!embedded){
 content.className='demo-stage';content.innerHTML='<div class="demo-shell"><iframe class="demo-frame" title="行動卡示例裝置" src="./action-card-review.html?frame=1"></iframe></div>';
 let fit=true;const select=document.querySelector('#device'),frame=document.querySelector('iframe'),shell=document.querySelector('.demo-shell');
 function resize(){const width=+select.value,height=width===1032?1376:width===1376?1032:1000,scale=fit?Math.min(1,(content.clientWidth-32)/width):1;frame.width=width;frame.height=height;frame.style.transform=`scale(${scale})`;shell.style.width=width*scale+'px';shell.style.height=height*scale+'px';document.querySelector('#fit').setAttribute('aria-pressed',String(fit));}
 select.addEventListener('change',resize);document.querySelector('#fit').addEventListener('click',()=>{fit=!fit;resize()});window.addEventListener('resize',resize);resize();
}else{
 document.querySelector('#outer-controls').remove();document.querySelector('#scenarios').hidden=false;content.className='demo-content';
 let scenario='long',filter='all',sort='readiness',watched=[],broken=false;
 function fixture(){
  const now=Date.now(),bar=Math.floor(now/3600000)*3600000,short=scenario==='short',tiny=scenario==='tiny',entry=tiny?0.000008:150,stop=tiny?0.0000076:short?157.5:142.5,tp1=tiny?0.0000088:short?135:165,tp2=tiny?0.0000096:short?120:180,price=tiny?0.00000784:short?153:147;
  const record={symbol:'SOLUSDT',status:'LIVE',checkedAt:now,snapshotUntil:scenario==='expired'?now-1:now+60000,marketSnapshot:{price,high:price*1.005,low:price*.995,barOpen:bar,requestedAt:now,receivedAt:now},row:{symbol:'SOLUSDT',analysis:{status:'VALID',analyzedAt:now,closedAt:bar-1,validUntil:bar+3600000,hourlyDirection:short?'SHORT':'LONG',fourHourlyDirection:short?'SHORT':'LONG',strategies:[{key:'breakout',status:scenario==='wait'?'WAIT':'SETUP',side:short?'SHORT':'LONG',entry,stop,tp1,tp2,signalAt:bar-1,expiresAt:bar+3600000,reason:'等待訊號棒成交量達前 20 根均量的 1.5 倍',observations:{version:'strategy-conditions-v1',closedAt:bar-1,close:149,upper:148,lower:130,averageVolume:100,lastVolume:scenario==='wait'?120:180,volumeRatio:scenario==='wait'?1.2:1.8,breakout:true,volumePassed:scenario!=='wait'}},{key:'structured',status:'WAIT',reason:'4 小時尚未形成明確趨勢'},{key:'meanReversion',status:'WAIT',reason:'等待均線靠攏'}]}}};
  return {now,state:{market:{status:scenario==='unavailable'?'ERROR':'LIVE',cryptoOnly:true,updatedAt:new Date(now).toISOString(),contractVerifiedAt:new Date(now).toISOString(),universeRows:[['','SOL / USDT','147',5,5e7,89],['','ETH / USDT','100',4,4e7,80],['','1000UNKNOWN / USDT','1',3,3e7,78],['','SUI / USDT','1',2,2e7,75],['','BTC / USDT','1',1,2e7,72]]},agents:{tradePlans:{SOLUSDT:record}},ui:{homeOpportunityFilter:filter,homeOpportunitySort:sort,homeWatchedSymbols:watched},forward:{},adviceMonitor:{}}};
 }
 function render(){const {state,now}=fixture();content.innerHTML='<p class="demo-note">僅為示例 · SOL 價格與判定均為測試資料</p><p class="demo-status" role="status"></p>'+homeOpportunityView(state,now);for(const b of document.querySelectorAll('[data-scenario]'))b.setAttribute('aria-pressed',String(b.dataset.scenario===scenario));if(broken)for(const img of content.querySelectorAll('.coin-logo img')){img.hidden=true;img.previousElementSibling.hidden=false;}}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scenario){scenario=b.dataset.scenario;render();}else if(b.id==='break-logo'){broken=!broken;render();}else if(b.dataset.homeOpportunityFilter){filter=b.dataset.homeOpportunityFilter;render();}else if(b.dataset.homeOpportunitySort){sort=b.dataset.homeOpportunitySort;render();}else if(b.dataset.homeWatchSymbol){const symbol=b.dataset.homeWatchSymbol;watched=watched.includes(symbol)?watched.filter(x=>x!==symbol):[...watched,symbol];render();}else if(b.dataset.agentAdviceSymbol||b.dataset.homeCheckSymbol||b.hasAttribute('data-home-check-all')){content.querySelector('.demo-status').textContent='此為版面示例，請回正式平台核對即時資料。';}});
 render();
}
</script></body></html>
